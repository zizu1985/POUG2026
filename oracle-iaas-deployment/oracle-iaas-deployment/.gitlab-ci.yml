  Create or update CI:
    stage: oracle_db_create_update_ci
    extends: .snow_create_update_ci
    image: registry.example.com/caas/caas-runner-images/itsm-integration-runner:1.0.2
    variables:
      CI_NAME: ${db_name}@${server}
      SNOW_BUSINESS_SERVICE: "Oracle DB Service"
      OPERATIONAL_STATUS: "1"
      PAYLOAD_CLUSTER: "{ \"version\": \"${version}\" ,\"sid\": \"${db_name}\" , \"environment\": \"${level_support}\", \"u_qualified\": \"true\", \"tcp_port\": \"${snow_port}\", \"serial_number\": \"${snow_port}\"}"
      SYS_CLASS_NAME: "cmdb_ci_db_ora_instance"
      LOCATION: "GLOBAL"
      SNOW_ASSIGNMENT_GROUP: ""
      SNOW_SOURCESYSTEMID: "source-system-teamsnow"
    script:
      - |
        # Enable debug
        set -x

        # Check if CI already exists
        snow cmdb resolve_ci_name --env=${SNOW_ENVIRONMENT} -c "${CI_NAME}" | tee get-sys-id.json
        SNOW_CMDB_CI_SYS_ID=$(cat get-sys-id.json | jq ".result.ci_definition[0].sys_id")

        if [ "$SNOW_CMDB_CI_SYS_ID" = "null" ]; then # If cmdb ci sys id is not provided, it means ci does not exist, we create it with the desired ci name
          snow cmdb create_update_ci --env=${SNOW_ENVIRONMENT} \
                                    --model_id="${MODEL_ID}" \
                                    --operational_status=${OPERATIONAL_STATUS} \
                                    --owning_service="${SNOW_BUSINESS_SERVICE}" \
                                    --support_service="${SNOW_ASSIGNMENT_GROUP}" \
                                    --payload="${PAYLOAD_CLUSTER}" \
                                    --sys_class_name="${SYS_CLASS_NAME}" \
                                    --location="${LOCATION}" \
                                    --ci_name="${CI_NAME}" \
                                    | tee new-ci.json
          SNOW_CMDB_CI_SYS_ID=$(cat new-ci.json | jq ".result.sys_id")
        else
          # If cmdb ci sys id is provided, it means ci already exists, we update it
          snow cmdb create_update_ci --env=${SNOW_ENVIRONMENT} \
                                    --model_id="${MODEL_ID}" \
                                    --operational_status=${OPERATIONAL_STATUS} \
                                    --owning_service="${SNOW_BUSINESS_SERVICE}" \
                                    --support_service="${SNOW_ASSIGNMENT_GROUP}" \
                                    --payload="${PAYLOAD_CLUSTER}" \
                                    --sys_class_name="${SYS_CLASS_NAME}" \
                                    --location="${LOCATION}" \
                                    --sys_id="${SNOW_CMDB_CI_SYS_ID}" 
        fi
      - |
        # Save sysid as env variable
        echo "SNOW_CMDB_CI_SYS_ID=${SNOW_CMDB_CI_SYS_ID}" >> build.env 
      - snow cmdb get_ci_details -c ${db_name}@${server} --env=${SNOW_ENVIRONMENT} --mulesoft_id $MULESOFT_ID --mulesoft_secret $MULESOFT_SECRET --username $SNOW_USERNAME --password $SNOW_PASSWORD --sourcesystemid $SNOW_SOURCESYSTEMID | jq '.result[].cmdb_ci.payload' | tr -d '"' > /tmp/tmp_file
      - echo "<payload>" > /tmp/tmp_file2 ; cat /tmp/tmp_file >> /tmp/tmp_file2 ; echo "</payload>" >> /tmp/tmp_file2  
      - mv /tmp/tmp_file2 $CI_PROJECT_DIR/ci_payload_info_${db_name}.xml 
    rules:
      - if: $action == "createdb" || $action == "full"    
    artifacts:
      when: always
      paths:
      - $CI_PROJECT_DIR/ci_payload_info_${db_name}.xml
      reports:
        dotenv: build.env  
    needs: ["Oracle Database Creation"]
    retry: 2

  Test CI:
    stage: test_ci_create_update
    image: registry.example.com/calm/automated-testing/testcore-linux-image:BSE_1.1
    dependencies:
      - 'Create or update CI'
    script:
      - pip install oracledb==3.4.2
      - pip install strip-ansi
      - if [ $error_nfs = "false" ] && [ $error_db_sw = "false" ] && [ $error_env_preparation = "false" ]; then
      -   pytest --color=yes -v --db_name $db_name --db_host $server --pathdir "$CI_PROJECT_DIR" --level_support $level_support --stage $CI_JOB_STAGE -o junit_family=legacy -W ignore::pytest.PytestExperimentalApiWarning --junit-xml tests/reports/junit_$request_id.xml tests/
      -   allure generate tests/reports    
      - else
      -   echo "Database Creation installation skipped no Tests Needed"
      - fi  
    rules:
      - if: $action == "createdb" || $action == "full"
    artifacts:
      when: always
      paths:
      - tests/reports
      - allure-report
      reports:
        junit: tests/reports/*.xml
    allow_failure: true



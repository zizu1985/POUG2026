  Create ServiceNow incident:
    stage: create_incident
    extends: .snow-get-vault-values
    script:
      - |
        set -x
        # Enable debug
        touch new-inc.json
        # Create incident
        if [ $error_db_creation = "true" ] || [ $error_db_sw = "true" ] || [ $error_nfs = "true" ] || [ $error_env_preparation = "true" ]; then
          if [ $error_nfs = "true" ]; then
            description="Oracle DB Deployment FS Creation Failed, Please check with team Review  GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            incident_short_description="Oracle Deployment FS Creation Failed"
          elif [ $error_db_creation = "true" ]; then
            description="Oracle DB Deployment Oracle Database Creation Failed, Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            incident_short_description="Oracle Deployment Database Creation Failed"
          elif [ $error_db_creation_nospace = "true" ]; then
            work_notes="Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            change_short_description="Oracle DB Deployment Database Creation failed, Because server space is not enough to create new Database"
            # change_description="Oracle DB Deployment Oracle Database Creation Failed"
          elif [ $error_db_sw = "true" ]; then
            description="Oracle DB Deployment Oracle Software Installation Failed, Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            incident_short_description="Oracle Deployment Oracle Software Installation Failed"
          elif [ $error_env_preparation = "true" ]; then
            description="Oracle DB Deployment Linux environment preparation Failed, Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            incident_short_description="Oracle Deployment Linux environment preparation Failed"
          fi
        else
          description="Incident created on Oracle deployment pipeline failure. Contact team for more information Request ${request_id}"
          incident_short_description="Oracle Deployment Pipeline failed."
        fi
        if [[ ${validation_error} -eq 0 ]]; then
          description="Oracle DB Deployment Input Validation failed. Failed fields: ${failed_fields} .Please check with team Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
          incident_short_description="Oracle Deployment Input Validation Failed"
          export change_short_description="Incorrect Input Values for fields ->"
          export change_short_description="$change_short_description $failed_fields"
        fi
        snow incident create_incident  --env="$SNOW_ENVIRONMENT" \
                            --assignment_group="INFRA Data Stores Level 1 Support" \
                            --short_description="${incident_short_description}" \
                            --description="$description" \
                            --category="Infrastructure" \
                            --subcategory="Other" \
                            --business_service="Oracle DB Service" \
                            --caller_id="${userid}" \
                            --impact="3" \
                            --urgency="3" \
                            --service_offering="Oracle DB - Bronze" \
                              | tee new-inc.json
        INC_NUMBER=$(cat new-inc.json | jq ".result.number")
        echo "SNOW_INC_NUMBER=${INC_NUMBER}" >> build.env
        # echo "email_short_description=$email_short_description" >> build.env
        echo "change_short_description=$change_short_description" >> build.env
    artifacts:
      paths:
        - ./new-inc.json
      reports:
        dotenv: build.env
    retry: 2
    when: on_failure


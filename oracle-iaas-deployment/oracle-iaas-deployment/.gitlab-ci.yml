      -   echo "Oracle New DB creation is failed. Server ${server} is reaching the maximum \# of allowed DB's. New VM to be requested."
      -   echo error_db_creation=true >> build.env
      -   echo error_db_creation_nospace=true >> build.env
      - fi
      - scp -i /root/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${SSH_USERNAME}@${server}:/opt/oracle/admin/backup/config/${db_name}.cfg ${db_name}.cfg || true
      - if [ ! -f ${db_name}.cfg ]; then
      -     touch ${db_name}.cfg
      - fi
      - chmod 664 ${db_name}.cfg
      - cat ${db_name}.cfg

      SNOW_CLOSE_CODE: "unsuccessful"
      SNOW_CLOSE_NOTES: 'The automation failed, please check attached logs.'
    # rules:
    #   - if: $action == "createdb" || $action == "full"
    # needs: ["Validating execution and error message on failure"]
    #rules:

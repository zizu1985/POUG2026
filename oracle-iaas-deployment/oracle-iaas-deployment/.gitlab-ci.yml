  Change create, update and close successful:
    stage: change_create_update_close_successful
    extends: .snow-open-update-and-close-successful
    image: registry.example.com/caas/caas-runner-images/itsm-integration-runner:1.0.2
    variables:
      SNOW_ASSIGNMENT_GROUP: "INFRA Data Stores Level 3 Support"
      SNOW_REQUESTEDBY: "${userid}"
      SNOW_SHORT_DESC: "This change is to document a Oracle Deployment. Oracle new DB creation was successful"
      SNOW_DESC: "Oracle DB Deployment: DB Name: ${db_name} Server - ${server} \n \n  Gitlab Url: ${gitlab_url} \n \n pipeline_parameters: \n  \t playbook=oracle_db_create \n \t mail_address=${mail_address} \n  \t db_name=${db_name} \n \t server=${server} \n \t version=${version}  \n \t request_id=${request_id} \n \t business_service=${business_service}"
      SNOW_CATEGORY: "Installation"
      SNOW_BUSINESS_SERVICE: "Oracle DB Service"
    script:
      - set -x
      - echo "The branch calling the library is '$CI_COMMIT_REF_NAME'"
      - echo "IMPORTANT, this change will be opened in the environment '$SNOW_ENVIRONMENT'"
      - |
        if [ -z "$SNOW_CMDB_CI_SYS_ID" ]; then
        # If means CI was created/taken - so it is pipeline run
        # with default parameters, so most probably during merge request 
          snow cmdb resolve_ci_name --env=${SNOW_ENVIRONMENT} -c "${default_db_name}@${default_server}" | tee get-sys-id.json
          SNOW_CMDB_CI_SYS_ID=$(cat get-sys-id.json | jq ".result.ci_definition[0].sys_id")
          snow change create --env=${SNOW_ENVIRONMENT} \
                            --assignment_group="$SNOW_ASSIGNMENT_GROUP" \
                            --requestedby="$SNOW_REQUESTEDBY" \
                            --short_description="$SNOW_SHORT_DESC" \
                            --description="$SNOW_DESC" \
                            --category="$SNOW_CATEGORY" \
                            --business_service="$SNOW_BUSINESS_SERVICE" \
                            --cmdb_ci="${SNOW_CMDB_CI_SYS_ID}" \
                            | tee new-cr.json
        else
          snow change create --env=${SNOW_ENVIRONMENT} --assignment_group="$SNOW_ASSIGNMENT_GROUP" --requestedby="$SNOW_REQUESTEDBY" --short_description="$SNOW_SHORT_DESC" --description="$SNOW_DESC" --category="$SNOW_CATEGORY" --business_service="$SNOW_BUSINESS_SERVICE" --cmdb_ci="$SNOW_CMDB_CI_SYS_ID" | tee new-cr.json
        fi
      - CR_NUMBER=$(cat new-cr.json | jq ".result.number")
      - 'JOB_LOGS_IDS=`curl --location --header "PRIVATE-TOKEN: ${GITLAB_API_KEY}" "https://code.example.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs"  | jq " .[].id"`' # Get pipeline job ids
      - 'JOB_LOGS_IDS=$(echo $JOB_LOGS_IDS | xargs -n1 | sort | xargs)' # order logs
      - |
        for id in ${JOB_LOGS_IDS}
        do
          URL="https://code.example.com/api/v4/projects/${CI_PROJECT_ID}/jobs/$id/trace"
          curl --location --header "PRIVATE-TOKEN: ${GITLAB_API_KEY}" ${URL} >> log_file.txt
        done
      - snow change update --number=${CR_NUMBER} --comment="${SNOW_COMMENT}" --worknote="${SNOW_WORKNOTE}" --attachment=@log_file.txt --env=${SNOW_ENVIRONMENT} 
      - snow change close --env=${SNOW_ENVIRONMENT}  --number=${CR_NUMBER} --close-code="${SNOW_CLOSE_CODE}" --close-notes="${SNOW_CLOSE_NOTES}"
      - echo "CR_NUMBER=${CR_NUMBER}" >> build.env
    retry: 2
    artifacts:
      reports:
        dotenv: build.env  
    when: on_success

  Communicate Oracle Deployment Success:
    stage: oracle_email_notification
    id_tokens:
      VAULT_ID_TOKEN:
        aud: https://code.example.com
    secrets:
      PULL_DATABASE_TOKEN:
        vault: GITLAB/pull_database_token@keyvault
        file: false
    before_script:
      - git config --global credential.helper "store --file ~/.git-credentials"
      - echo "https://pull_database_token:${PULL_DATABASE_TOKEN}@code.example.com" > ~/.git-credentials
      - git config --global credential.helper store
    script:
      - set -x
      - ansible-galaxy install -r requirements.yml -f -p ./ansible
      - cd ./ansible
      - echo $itsm
      - echo $error_nfs
      - echo $bd
      - echo $sw
      - echo $snow_port
      - if [ $itsm = "true" ] && [ $error_env_preparation = "false" ] && [ $error_nfs = "false" ] && [ $error_db_creation = "false" ] && [ $error_db_sw = "false" ] ; then
      -   if [ $action = "createdb" ] || [ $action = "full" ]; then
      -     snow_desc_mail="Oracle DB Deployment implemented successfully"    
      -   fi
      -   if [ $action = "installsw" ]; then
      -     snow_desc_mail="Oracle DB Software Installation completed successfully"
      -   fi    
      -   if [ $action = "prepare" ]; then
      -     snow_desc_mail="Oracle DB Preparation Environment implemented successfully"
      -   fi        
      -   if [ $error_db_exist = "true" ]; then
      -     snow_desc_mail="Oracle DB already exists on the server"
      -   fi        
      - echo $snow_desc_mail
      -   ansible-playbook -i localhost ./ansible-playbook-send-mail.yml
          --extra-vars "requester=${mail_address}
          getit_req=${request_id}
          snow_req=${CR_NUMBER}
          component=\"Oracle Db Deployment\"
          status_email=success
          team_email=${success_email_notification}
          header_option=successful 
          ci_name=${db_name}@${server}
          snow_inc=${incident_id}
          hostname=${server}
          DbName=${db_name}
          Port="N/A"
          Environment=${level_support}
          action="N/A"
          oracle_version=${version}
          snow_desc=\"${snow_desc_mail}\" "
          --ssh-common-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      - fi
    # rules:
    #   - if: $action == "createdb" || $action == "full" || $action == "installsw" || $action == "prepare"
    retry: 2
    # allow_failure: true
    when: on_success

  Validating execution and error message on failure:
    stage: validate_execution_error_mesg
    before_script:
      - if [[ ${validation_error} -eq 0 ]]; then
      -   exit 0     
      - fi
    script:
      - |
        set -x
        if [ $error_db_creation = "true" ] || [ $error_db_sw = "true" ] || [ $error_nfs = "true" ] || [ $error_env_preparation = "true" ]; then
          if [ $error_nfs = "true" ]; then
            work_notes="Please check with team. Review  GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            change_short_description="Oracle DB Deployment FS Creation failed"
            # change_description="Oracle DB Deployment FS Creation Failed while preparing linux server."
          elif [ $error_db_creation = "true" ]; then
            work_notes="Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            change_short_description="Oracle DB Deployment Database Creation failed"
            # change_description="Oracle DB Deployment Oracle Database Creation Failed"
          elif [ $error_db_creation_nospace = "true" ]; then
            work_notes="Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            change_short_description="Oracle DB Deployment Database Creation failed, Because server space is not enough to create new Database"
            # change_description="Oracle DB Deployment Oracle Database Creation Failed"
          elif [ $error_db_sw = "true" ]; then
            work_notes="Please Review GitLab Output - Url: ${gitlab_url} - Request ID - ${request_id}"
            change_short_description="Oracle DB Deployment Oracle Software Installation failed"
            # change_description="Oracle DB Deployment Oracle Software Installation Failed"
          elif [ $error_env_preparation = "true" ]; then
            work_notes="Please Review GitLab Output - ${gitlab_url}. Fix and relaunch it again"
            change_short_description="Oracle DB Deployment Linux environment preparation failed"
            # change_description="Oracle DB Deployment Linux environment preparation Failed"
          fi
        else
            work_notes="Oracle DB Deployment Failed please check error log in pipeline"
            change_short_description="Oracle DB Deployment Failed"
            change_description="Oracle DB Deployment Failed. please check the error logs and relaunch it."
        fi
        echo work_notes=$work_notes >> build.env
        echo change_short_description=$change_short_description >> build.env
        # echo change_description=$change_description >> build.env
    #rules:
    #  - if: $validation_error == "1"
    artifacts:
      reports:
        dotenv: build.env  
    when: on_failure


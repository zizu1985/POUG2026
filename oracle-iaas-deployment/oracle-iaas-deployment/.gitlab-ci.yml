  ################################# PIPELINE GLOBAL CONFIGURATION #######################################
  workflow:
    name: "Oracle deployment Service Activities"
    rules:
    # Environment parameters
    - if: $CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_TAG
      variables:
        SNOW_ENVIRONMENT: 'PROD'
        SEND_MAIL: 'true'
        JENKINS_JOB_ENV: 'jenkinsprd'
    - if: $CI_COMMIT_REF_NAME != "master" && $TEST_RUN == "false"
      variables:
        SNOW_ENVIRONMENT: 'TEST'
        SEND_MAIL: 'false'
        JENKINS_JOB_ENV: 'jenkinsnonprd'
    - if: $TEST_RUN == "true"
      variables:
        SNOW_ENVIRONMENT: 'TEST'
        SEND_MAIL: 'true'
        JENKINS_JOB_ENV: 'jenkinsnonprd'
    - if: $level_support == "Sandpit"
      variables:
        nologic_monitor: 'true'
    - if: $action == "full"
      variables:
        prepare: 'true'
        sw: 'true'
        bd: 'true'
    - if: $action == "prepare"
      variables:
        prepare: 'true'
        sw: 'false'
        bd: 'false'
    - if: $action == "installsw"
      variables:
        prepare: 'false'
        sw: 'true' 
        bd: 'false'
    - if: $action == "createdb"
      variables:
        prepare: 'false'
        sw: 'false'
        bd: 'true'
        

  stages:
  - validate_input
  - launch_oracle_environment_preparation
  - test_environment_preparation
  - oracle_software_install
  - test_oracle_soft_install
  - oracle_db_create
  - test_oracle_db_create
  - oracle_db_create_update_ci
  - test_ci_create_update
  - oracle_create_ci_relations
  - change_create_update_close_successful
  - oracle_email_notification
  - validate_execution_error_mesg
  - change_create_update_close_failure
  - create_incident
  - oracle_email_notification_failure
  - get_artifacts
  
################################# PIPELINE STAGES ######################################################
  Validate :
    stage: validate_input
    image: registry.example.com/caas/caas-runner-images/itsm-integration-runner:1.0.2
    id_tokens:
      VAULT_ID_TOKEN:
        aud: https://code.example.com
    secrets:
      SNOW_USERNAME:
        vault: SNOW/username@keyvault
        file: false
      SNOW_PASSWORD:
        vault: SNOW/password@keyvault
        file: false
      MULESOFT_ID:
        vault: SNOW/mulesoft_id@keyvault
        file: false
      MULESOFT_SECRET:
        vault: SNOW/mulesoft_secret@keyvault
        file: false
      GITLAB_API_KEY:
        vault: GITLAB/api_key@keyvault
        file: false
      SNOW_SOURCESYSTEMID:
        vault: SNOW/sourcesystemid@keyvault
        file: false
    script:
      - set -x
      - export failed_fields=""
      - export snow_desc='Incorrect Input Values for fields ->'
      - touch build.env
      - source ./scripts/validate_checks_functions.sh
      - declare -a failed_fields=()
      - snow cmdb get_ci_details -c ${server} --env="${SNOW_ENVIRONMENT}" --mulesoft_id ${MULESOFT_ID} --mulesoft_secret ${MULESOFT_SECRET} --username ${SNOW_USERNAME} --password ${SNOW_PASSWORD} --sourcesystemid ${SNOW_SOURCESYSTEMID}| jq ".result[].cmdb_ci.payload" | tr -d '"'  > temp.xml
      - echo "<payload>" > ./temp2.xml ; cat temp.xml >> temp2.xml ; echo "</payload>" >> temp2.xml
      - os_majorversion=$(python -c 'from xml.dom import minidom ; xmldoc = minidom.parse("temp2.xml") ; print(xmldoc.getElementsByTagName("os_version")[0].firstChild.nodeValue)' | cut -d. -f1)
      - echo $os_majorversion
      - if [ $action = "prepare" ]; then
      -   echo "Action called -> prepare"
      -   check_business_service
      -   check_server
      -   check_db_name
      -   check_size_db
      -   check_level_support
      -   check_os_majorversion
      - elif [  $action = "installsw" ]; then
      -   echo "Action called -> installsw"
      -   check_business_service
      -   check_server
      -   check_version
      -   check_os_majorversion
      - elif [  $action = "full" ]; then
      -   echo "Action called -> full"
      -   check_business_service
      -   check_server
      -   check_db_name
      -   check_size_db
      -   check_level_support
      -   check_version
      -   check_os_majorversion
      - elif [  $action = "createdb" ]; then
      -   echo "Action called -> createdb"
      -   check_business_service
      -   check_server
      -   check_db_name
      -   check_version
      -   check_level_support
      -   check_os_majorversion
      - else
      -   echo "action input failure -> adding to failed fields"
      -   failed_fields+=("action")
      - fi
      - if [ $os_majorversion = "9" ]; then
      -   check_version_for_rhel9
      - fi
      - if [[ ${#failed_fields[@]} -ge 1 ]]; then
      -   failed_fields_save=""
      -   if [[ ${#failed_fields[@]} -eq 1 ]]; then   
      -     failed_fields=$(echo $failed_fields | xargs) 
      -     echo failed_fields=$failed_fields >> build.env 
      -   else 
      -    for i in "${failed_fields[@]}"; do
      -      failed_fields_save="$failed_fields_save $i"
      -    done
      -    failed_fields_save=$(echo $failed_fields_save | xargs) 
      -    echo $failed_fields_save
      -    echo failed_fields=$failed_fields_save >> build.env
      -   fi 
      -   echo validation_error=0 >> build.env
      -   exit 2
      - fi
      - echo os_majorversion=$os_majorversion >> build.env
    artifacts:
      reports:
        dotenv: build.env
    retry: 2
    allow_failure: false

  launch_oracle_environment_preparation:
    stage: launch_oracle_environment_preparation
    id_tokens:
      VAULT_ID_TOKEN:
        aud: https://code.example.com
    secrets:
      api_database_user:
        vault: GITLAB/api_database_user@keyvault
        file: false
      api_database_password:
        vault: GITLAB/api_database_password@keyvault
        file: false
      api_jenkins_user:
        vault: JENKINS_APIUSER/${JENKINS_JOB_ENV}/api_jenkins_user@keyvault
        file: false
      api_jenkins_token:
        vault: JENKINS_APIUSER/${JENKINS_JOB_ENV}/api_jenkins_token@keyvault
        file: false
      PULL_DATABASE_TOKEN:
        vault: GITLAB/pull_database_token@keyvault
        file: false
    before_script:
      - git config --global credential.helper "store --file ~/.git-credentials"
      - echo "https://gitlab-ci-token:$CI_JOB_TOKEN@code.example.com" > ~/.git-credentials
      - git config --global credential.helper store
    script:
      - set -x
      - echo $action
      - echo $prepare
      - echo $sw
      - echo $bd
      - echo $linux_env_preparation
      - echo $fs_extended 
      - echo $level_support
      - git clone https://code.example.com/cir/jenkins-launcher.git
      - |
        python ./jenkins-launcher/launch_jenkins/launch_jenkins.py \
          -q \
          --dump \
          -j "https://${JENKINS_JOB_ENV}.dcmain2.example.com/job/LINUX/job/JenkinsPipelineEnvPrepOracle/view/tags/job/${oracle_env_prep_version}/" \
          -u "${api_jenkins_user}" \
          -t "${api_jenkins_token}" \
          prep_role_version="${prep_role_version}" \
          server="${server}" \
          db_name="${db_name}" \
          size_db="${size_db}" \
          version="${version}" \
          request_id="${request_id}" \
          mail_address="${mail_address}" \
          userid="${userid}" \
          business_service="\"${business_service}\"" \
          db_usage="noprod" \
          pb_vc_hostname="" \
          pb_vc_cluster="" \
          pb_vc_datacenter="" \
          role_manage_filesystem_version="${role_manage_fs_version}" \
          > api_jenkins_job_output.txt | true
      # - echo -e '[GitLab Pipeline Status] Notified \nFinished:SUCCESS' > api_jenkins_job_output.txt
      - cat api_jenkins_job_output.txt
      - build_status=$(cat api_jenkins_job_output.txt | grep -oP "(?<=Finished:\ ).*" | tail -1)
      - echo $build_status
      - if  [  $build_status = "FAILURE" ]; then
      -    echo "Linux environment has failed to be prepared"
      -    echo linux_env_preparation=0 >> build.env
      -    linux_env_preparation=0
      - elif [  $build_status = "SUCCESS" ]; then
      -    echo "Linux environment prepared successfully"
      -    echo linux_env_preparation=1 >> build.env
      -    linux_env_preparation=1
      - elif  [  $build_status = "UNSTABLE" ]; then
      -    echo "Linux environment prepared partially"
      -    echo linux_env_preparation=1 >> build.env
      -    linux_env_preparation=1
      - else
      -    echo "Linux environment has failed to be prepared and status is unknown"
      -    echo error_env_preparation=true >> build.env;
      -    exit 1;
      - fi
      - if [ $linux_env_preparation = 1 ]; then
      -     domain=$(echo $server | cut -d'.' -f2-)
      -     echo $domain
      -     if [ $level_support = "Production" ]; then
      -        nas_device=$(cat ./vars/nas_device_prod.tmp  | grep "$domain " | awk ' -F ";" { print $2}')
      -     else
      -        nas_device=$(cat ./vars/nas_device_noprod.tmp  | grep "$domain " | awk ' -F ";" { print $2}')
      -     fi
      -     echo $nas_device
      -     if [  $nas_device = "cohesity" ]; then
      -         echo " NFS not found or Cohesity"
      -     else 
      -       if [ -n "$nas_device" ]; then
      -           curl -u $api_database_user:$api_database_password https://iacapi.example.com/v1/form/ahm-auto-manage-filesystem/submit -d "{\"fqdn\":\"$server\",\"user_action\":\"mounted\",\"mountpoint\":\"/ora_backup\",\"fs_owner\":\"oracle\",\"fs_group\":\"oinstall\",\"device\":\"$nas_device\",\"fs_type\":\"nfs\",\"mount_opts\":\"rw,bg,hard,intr,rsize%3D1048576,wsize%3D1048576,nosuid,nodev,proto%3Dtcp,vers%3D3,timeo%3D600,actimeo%3D0\",\"getit_requestor_id\":\"$userid\",\"getit_requestor_email\":\"team@example.com\",\"request_id\":\"$request_id\"}" > /tmp/curl.output
      -           cat /tmp/curl.output
      -           job_url=$(cat /tmp/curl.output | awk  -F ":" '{ print $2 }' | sed 's/.$//' )
      -           echo $job_url
      -           while true
      -           do
      -             status_curl_job=$(curl -u $api_database_user:$api_database_password https://iacapi.example.com/v1/status/$job_url | awk  -F ":" '{ print $2 }' | awk  -F , '{ print $1 }'| sed 's/\"//g' )
      -             echo $status_curl_job
      -             if  [  $status_curl_job = "FAILURE" ]; then
      -                echo " FS has failed to be extended"
      -                echo fs_extended=0 >> build.env
      -                fs_extended="0"
      -                break
      -             fi
      -             if  [  $status_curl_job = "SUCCESS" ]; then
      -                echo "FS  extended"
      -                echo fs_extended=1 >> build.env
      -                fs_extended="1"
      -                break
      -             fi
      -             if  [  $status_curl_job = "UNSTABLE" ]; then
      -                echo "NFS  extended partially"
      -                echo fs_extended=1 >> build.env
      -                fs_extended="2"
      -                break
      -             fi
      -             sleep 120
      -           done
      -       fi
      -     fi
      - fi
      - if [ $linux_env_preparation = 0 ]; then
      -   error_env_preparation='true'
      -   echo error_env_preparation=true >> build.env
      - fi
      - if [ $fs_extended = 0 ]; then
      -   error_nfs='true'
      -   echo error_nfs=true >> build.env
      - else
      -  echo "NFS on DC1main or DC2main not needed due to is for Cohesity"
      - fi    
    rules:
      - if: $action == "prepare" || $action == "full"
    artifacts:
      reports:
        dotenv: build.env
    retry: 2
    # allow_failure: true

  test_environment_preparation:
    stage: test_environment_preparation
    image: registry.example.com/calm/automated-testing/testcore-linux-image:BSE_1.1
    script: 
      - set -x
      - echo "$server ansible_ssh_private_key_file=id_rsa ansible_user=oracle ansible_ssh_extra_args='-o StrictHostKeyChecking=no'" >> inventory
      - echo "${database_key}" > ./id_rsa
      - chmod 400 ./id_rsa
      - pip install oracledb==3.4.2
      - pip install strip-ansi
      - pytest --hosts=$server  --force-ansible --hosts='ansible://all' --ansible-inventory=inventory --color=yes -v -W ignore::pytest.PytestExperimentalApiWarning --db_host $server --db_name $db_name --db_size $size_db --stage $CI_JOB_STAGE --pathdir "$CI_PROJECT_DIR" --os_version $os_majorversion --level_support $level_support --stage $CI_JOB_STAGE -o junit_family=legacy --junit-xml tests/reports/junit_$request_id.xml  tests/prepare
      - testsrc=$?
      - allure generate tests/reports
      - echo error_env_preparation=$error_env_preparation >> build.env
      - echo fs_extended=$fs_extended >> build.env
      - echo linux_env_preparation=$linux_env_preparation >> build.env
      - if [ $error_env_preparation == "true" ] || [ $fs_extended == "true" ] || [ $linux_env_preparation == "true" ] || [ $testsrc -gt 0 ]; then
      -     exit 1
      - fi
    rules:
      - if: $action == "prepare" ||  $action == "full"
    artifacts:
      when: always
      paths:
      - tests/reports
      - allure-report
      reports:
        junit: tests/reports/*.xml
        dotenv: build.env
    dependencies:
      - 'launch_oracle_environment_preparation'
      - 'Validate'
    when: always
    allow_failure: true

  Oracle Software Installation:
    stage: oracle_software_install
    id_tokens:
      VAULT_ID_TOKEN:
        aud: https://code.example.com
    secrets:
      PULL_DATABASE_TOKEN:
        vault: GITLAB/pull_database_token@keyvault
        file: false
    before_script: 
      - echo "${database_key}" > /root/id_rsa
      - chmod 400 /root/id_rsa
      - export ANSIBLE_HOST_KEY_CHECKING=False
      - git config --global credential.helper "store --file ~/.git-credentials"
      - echo "https://pull_database_token:${PULL_DATABASE_TOKEN}@code.example.com" > ~/.git-credentials
      - git config --global credential.helper store
    script:
      - set -x
      - echo $error_env_preparation
      - echo $error_nfs      
      - if [ $error_nfs = "false" ] && [ $error_env_preparation = "false" ]; then
      -   echo "Checking for Python 3 on the target host..."
      -   INTERPRETER="/usr/bin/python" 
      -   if ssh -o StrictHostKeyChecking=no -i /root/id_rsa oracle@pytestsrv.dcmain2.example.com "test -f /usr/bin/python3"; then
      -       echo "Python 3 found. Using /usr/bin/python3"
      -       INTERPRETER="/usr/bin/python3"
      -   else
      -       echo "Python 3 not found. Using /usr/bin/python"
      -   fi
      -   ansible-galaxy install -r requirements.yml -f -p ./ansible
      -   ansible-playbook ./ansible/ansible-playbook_oracle_soft_install/tasks/main.yml   -u "$SSH_USERNAME" --private-key /root/id_rsa -i $server, --ssh-common-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --extra-vars "version=$version db_server=$server ansible_python_interpreter=$INTERPRETER"
      -   if grep -q "ORACLE DATABASE SOFTWARE SUCCESSFULLY INSTALLED" ./ansible/ansible-playbook_oracle_soft_install/tasks/oracle_soft_install_${version}.out; then
      -     echo "SW installtion completed succssfully"
      -     echo "SUCCESSFULLY" >> $CI_PROJECT_DIR/oracle_check_${db_name}.out 
      -     echo error_db_sw='false' >> build.env
      -   else
      -     echo "Soft installation failed"
      -     error_db_sw='true'
      -     echo error_db_sw='true' >> build.env
      -   fi
      - else
      -   echo "Soft installation skipped"
      -   echo skipped_db_sw='true' >> build.env
      - fi
    after_script:
      - set -x
      - ls -altr ./ansible/ansible-playbook_oracle_soft_install/
      - if ! grep -q "SUCCESSFULLY" $CI_PROJECT_DIR/oracle_check_${db_name}.out; then
      -   echo "Oracle Software installation failed - Out of space or server not reachable"
      -   echo "Soft installation failed" 
      -   echo error_db_sw='true' >> build.env
      - fi
    rules:
      - if: $action == "full" || $action == "installsw"
    artifacts:
      paths:
        - oracle_check_${db_name}.out  
      reports:
        dotenv: build.env
    retry: 2
    # allow_failure: true

  Test Oracle Software Installation:
    stage: test_oracle_soft_install
    image: registry.example.com/calm/automated-testing/testcore-linux-image:BSE_1.1
    dependencies:
      - 'Oracle Software Installation'
    script: 
      - set -x
      - pip install oracledb==3.4.2
      - pip install strip-ansi
      - if [ $error_nfs = "false" ] && [ $error_db_sw = "false" ] && [ $error_env_preparation = "false" ] && [ ! -z $db_name ]; then
      -   pytest --color=yes -v --db_host $server --db_name $db_name  --pathdir "$CI_PROJECT_DIR" --level_support $level_support --stage $CI_JOB_STAGE -o junit_family=legacy -W ignore::pytest.PytestExperimentalApiWarning --junit-xml tests/reports/junit_$request_id.xml tests/
      - else 
      -   pytest --color=yes -v --pathdir "$CI_PROJECT_DIR" --level_support $level_support --db_host $server --stage $CI_JOB_STAGE -o junit_family=legacy -W ignore::pytest.PytestExperimentalApiWarning --junit-xml tests/reports/junit_$request_id.xml tests/
      - fi
      - allure generate tests/reports
    rules:
      - if: $action == "full" || $action == "installsw"
    artifacts:
      when: always
      paths:
      - tests/reports
      - allure-report
      reports:
        junit: tests/reports/*.xml
    allow_failure: true

  Oracle Database Creation:
    stage: oracle_db_create
    id_tokens:
      VAULT_ID_TOKEN:
        aud: https://code.example.com
    secrets:
      PULL_DATABASE_TOKEN:
        vault: GITLAB/pull_database_token@keyvault
        file: false
    before_script: 
      - echo "${database_key}" > /root/id_rsa
      - chmod 400 /root/id_rsa
      - export ANSIBLE_HOST_KEY_CHECKING=False
      - git config --global credential.helper "store --file ~/.git-credentials"
      - echo "https://pull_database_token:${PULL_DATABASE_TOKEN}@code.example.com" > ~/.git-credentials
      - git config --global credential.helper store
      - |- 
          if [[ $level_support == "Production" ]]; then
            level_support_status='prod'
          fi
    script:
      - set -x
      - echo $error_nfs
      - echo $error_db_sw
      - echo $error_env_preparation
      - if  [ $error_nfs = "false" ] && [ $error_db_sw = "false" ] && [ $error_env_preparation = "false" ]; then
      -   ansible-galaxy install -r requirements.yml -f -p ./ansible
      -   ansible-playbook ./ansible/ansible-playbook_oracle_db_create/tasks/main.yml -u "$SSH_USERNAME" --private-key /root/id_rsa -i $server,  --ssh-common-args="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          --extra-vars "version=${version}
          dbname=${db_name}
          level_supp=${level_support_status}
          ora_username=${ora_username}
          ora_password=${ora_password}
          lmpassword=${lmpassword}
          mail_address=${mail_address}"
      -   if grep -q "DATABASE ALREADY EXISTS" ./ansible/ansible-playbook_oracle_db_create/tasks/dbexists_${db_name}.out; then    
      -         echo "Database Already exists"
      -         echo "SUCCESSFULLY" >> $CI_PROJECT_DIR/oracle_check_${db_name}.out
      -         echo error_db_exist='true' >> build.env
      -         echo success_db_creation='true' >> build.env
      -   else
      -     if grep -q "DATABASE SUCCESSFULLY CREATED" ./ansible/ansible-playbook_oracle_db_create/tasks/oracle_db_create_${db_name}.out; then
      -       echo "Database successfully Created"
      -       echo "SUCCESSFULLY" >> $CI_PROJECT_DIR/oracle_check_${db_name}.out
      -       snow_port=$(cat ./ansible/ansible-playbook_oracle_db_create/tasks/port_${db_name}.out)
      -       echo success_db_creation='true' >> build.env
      -       echo snow_port=$snow_port >> build.env
      -       echo $snow_port > $CI_PROJECT_DIR/port_${db_name}.out
      -     else
      -       echo "Database creation failed"
      -       error_db_creation='true'
      -       echo error_db_creation=true >> build.env
      -     fi #successfukllt
      -   fi  # already exists         
      - fi # first if [ $error_nfs = "false" ] && [ $error_db_sw = "false" ] && [ $error_env_preparation = "false" ]; then
